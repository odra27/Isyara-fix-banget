# Single source of truth for the BISINDO modeling pipeline.
# Relative paths are resolved against the ml/ folder.

paths:
  videos_dir: "c:/Users/Joshevan/Downloads/wl-bisindo-raw/videos"
  data_dir: "data"            # manifest, landmark cache, QC (gitignored)
  runs_dir: "runs"            # experiment logs (gitignored)
  artifacts_dir: "artifacts"  # final deliverables
  hand_model: "mp_models/hand_landmarker.task"
  pose_model: "mp_models/pose_landmarker_lite.task"

extract:
  max_width: 960              # frames are downscaled before MediaPipe (speed)
  num_hands: 2
  min_hand_detection_confidence: 0.5
  min_hand_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  workers: 10

qc:
  # Clips start/end with hands resting out of frame, so ~35% hand-less frames is normal.
  min_hand_frame_ratio: 0.2   # excluded if < 20% of frames have >=1 hand
  min_hand_frames: 12         # ... or fewer than 12 frames with a hand
  min_pose_frame_ratio: 0.5

features:
  # Upper-body pose points (MediaPipe Pose indices): nose, shoulders, elbows, wrists.
  pose_points: [0, 11, 12, 13, 14, 15, 16]
  max_gap_frames: 5           # hand-detection gaps up to this length are interpolated
  rest_mask_y: 1.35           # hands with wrist lower than this (shoulder widths below shoulders) = resting, masked
  T: 48                       # resample length
  use_pose: true
  use_velocity: true
  trim:
    enabled: true
    motion_threshold: 0.02    # mean hand displacement per frame, in shoulder-width units
    smooth_window: 3
    pad_frames: 3
    max_still_edge_frames: 10 # still frames kept before first / after last movement
    min_keep_frames: 8
  min_frames_for_inference: 8

augment:
  enabled: true
  rotate_deg: 15
  scale: [0.85, 1.15]
  shift: 0.15
  time_warp: 0.2              # max local speed change of the nonuniform time warp
  crop_max_ratio: 0.15        # random crop at start/end
  frame_drop_p: 0.1
  noise_std: 0.01
  hand_dropout_p: 0.3         # probability to apply a short hand-dropout span
  mirror_p: 0.5
  hold_pad_max: 10            # repeat first/last frame (auto-capture still-hold before stop)
  # Continuous signing (scripts/live_continuous.py): words start/end with hands already up.
  # With this probability, cut midair_crop of the sign at each end (the rise from / return to rest).
  midair_p: 0.5
  midair_crop: [0.1, 0.35]

none_class:
  enabled: true
  ratio: 0.08                 # fraction of each training batch that is synthetic "none"
  none_weight: 2.0            # extra loss weight on the none class (real + synthetic negatives)
  # sampling weights of synthetic none kinds [still hold, splice of two signs, rigid trajectory].
  # Splices look like a mid-air word fragment, so they are rarer than the default uniform 1/3.
  kind_p: [0.45, 0.1, 0.45]

# Demo vocabulary (Alur A). Chosen for Puskesmas relevance + LOSO F1 (runs/gru_base), avoiding
# pairs the model confuses (Terima kasih/Kapan, Siang/Sore, Keluarga/Cari, Apa/Berangkat).
# All other labels are real "not in vocabulary" signs for the none class.
vocab:
  #            Lagi Maaf Saya TerimaKasih Tuli Siapa DiMana Bagaimana Datang Malam
  demo_labels: [5, 6, 9, 10, 11, 13, 15, 17, 24, 31]
  # Never trained on during LOSO -> honest test of rejecting unseen words. Deliberately the ones most
  # similar to demo words (Kapan~Terima kasih, Air~Malam, Rumah~Saya, Apa, Hari, Siang).
  unknown_holdout: [0, 3, 12, 14, 27, 29]

model:
  type: gru
  hidden: 128
  layers: 2
  embed_dim: 256
  dropout: 0.3

train:
  epochs: 80
  batch_size: 64
  lr: 0.002
  weight_decay: 0.01
  label_smoothing: 0.1
  seed: 42
  threads: 10

eval:
  loso_signers: [1, 2, 3, 4]  # signers that have all 32 labels
  extra_test_signer: 0        # labels 0-11 only
  hidden_labels: [3, 9, 14, 19, 24, 29]   # leave-labels-out open-set experiment

calibration:
  accept_precision_target: 0.97
  unknown_reject_target: 0.90 # fraction of non-sign ("none") movement that must fall below confirm
  unknown_word_prior: 0.10    # assumed share of out-of-vocabulary signs among inputs (for accept precision)
  # which negatives must mostly (unknown_reject_target) land below the confirm threshold
  # Full 32-word model (deployed): only `none` — no real negative words exist when all words are known.
  # For the 10-word demo model use [none, unknown_word, negative_word].
  confirm_reject_groups: [none]
  confirm_min: 0.40
  # Manual accept threshold on the raw (temperature-scaled) confidence; null = choose from
  # accept_precision_target (0.955 for gru_base). 0.85 on gru_base OOF: accept 71% -> 84% of known words,
  # accept precision with 10% out-of-vocabulary signs 0.97 -> 0.94. Lowered for the demo (more accepts).
  raw_accept_override: 0.85
  centroid_known_percentile: 2.0
  # Output contract thresholds (PRD §10 kiosk decision). Calibrated scores are remapped onto these.
  kiosk_accept: 0.85
  kiosk_confirm: 0.60

predict:
  max_frames: 600             # Predictor rejects longer sequences (ValueError); 8 s @ 30 fps = 240

# Auto-capture guard rails (PRD §9) used by scripts/live_demo.py. The frontend capture should use the same values.
capture:
  hand_stable_ms: 250
  min_record_ms: 500
  max_record_ms: 8000
  still_hold_ms: 1500
  hand_lost_ms: 500
  detect_grace_ms: 150        # HAND_DETECTED tolerates detector flicker of a frame or two
  motion_window_frames: 10
  motion_threshold: 0.008     # mean normalized-image displacement per frame
  result_hold_ms: 4000
  # Continuous mode (scripts/live_continuous.py): words separated by a short still pause, hands stay up.
  word_pause_ms: 600          # still this long = end of one word
  sentence_pause_ms: 2000     # still this long (or hands down) = end of the sentence
  min_word_ms: 400            # shorter word segments are noise
  max_word_ms: 4000           # force a word boundary during non-stop movement
  word_motion_window_frames: 4  # shorter motion window than single-word mode -> faster pause detection
  preroll_frames: 6           # frames before the detected resume that belong to the next word (covers motion-window lag)
  live_hint_ms: 200           # how often the running "reading..." guess is refreshed
